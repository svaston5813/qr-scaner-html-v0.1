<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>MAC Scanner</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #0a0a0a;
    color: #eaeaea;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* --- КАМЕРА (верхняя часть) --- */
  #camera-zone {
    position: relative;
    flex: 1 1 55%;
    min-height: 0;
    background: #000;
    overflow: hidden;
  }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #frame {
    position: absolute;
    top: 50%; left: 50%;
    width: min(65vw, 65vh);
    height: min(65vw, 65vh);
    transform: translate(-50%, -50%);
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: 12px;
    pointer-events: none;
  }
  #frame::before, #frame::after {
    content: "";
    position: absolute;
    width: 28px; height: 28px;
    border: 3px solid #eaeaea;
  }
  #frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
  #frame::after  { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 12px; }

  #status {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    padding: 6px 14px;
    background: rgba(0,0,0,0.7);
    border-radius: 100px;
    font-size: 12px;
    letter-spacing: 0.3px;
    color: #bbb;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
    white-space: nowrap;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #status.show { opacity: 1; }
  #status.error { background: rgba(180,40,40,0.85); color: #fff; }

  /* --- ПАНЕЛЬ СНИЗУ --- */
  #bottom {
    flex: 1 1 45%;
    display: flex;
    flex-direction: column;
    background: #0a0a0a;
    border-top: 1px solid #1c1c1c;
    min-height: 0;
  }

  /* шапка списка */
  #bottom-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid #1c1c1c;
    flex-shrink: 0;
  }
  #count {
    font-size: 13px;
    color: #888;
    letter-spacing: 0.3px;
  }
  #last {
    margin-left: auto;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #4ade80;
    opacity: 0;
    transition: opacity .3s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 55%;
    text-align: right;
  }
  #last.show { opacity: 1; }

  /* список */
  #list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 10px;
    min-height: 0;
  }
  #empty {
    text-align: center;
    color: #444;
    font-size: 13px;
    padding: 24px 16px;
    line-height: 1.5;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    background: #141414;
    border: 1px solid #1c1c1c;
    border-radius: 8px;
    margin-bottom: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    transition: background .15s, border-color .15s;
    cursor: pointer;
  }
  .item:active { background: #1a1a1a; }
  .item.selected {
    background: #0e1f36;
    border-color: #2563eb;
  }
  .item .num {
    color: #555;
    font-size: 12px;
    min-width: 22px;
    text-align: right;
    flex-shrink: 0;
  }
  .item.selected .num { color: #7ba8ff; }
  .item .mac {
    flex: 1;
    color: #d0d0d0;
    word-break: break-all;
    letter-spacing: 0.2px;
  }
  .item.selected .mac { color: #fff; }

  /* нижняя панель с кнопкой */
  #actions {
    flex-shrink: 0;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid #1c1c1c;
  }
  #copy-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background .15s, opacity .15s;
    touch-action: manipulation;
  }
  #copy-btn:active { background: #1d4ed8; }
  #copy-btn:disabled {
    background: #1a1a1a;
    color: #444;
    cursor: default;
  }

  #canvas { display: none; }
</style>
</head>
<body>
<div id="app">

  <div id="camera-zone">
    <video id="video" playsinline muted autoplay></video>
    <div id="frame"></div>
    <div id="status"></div>
  </div>

  <div id="bottom">
    <div id="bottom-head">
      <span id="count">0</span>
      <span id="last"></span>
    </div>

    <div id="list">
      <div id="empty">Наведите камеру на QR-код<br>Сканирование идёт автоматически</div>
    </div>

    <div id="actions">
      <button id="copy-btn" disabled>Копировать всё</button>
    </div>
  </div>

</div>

<canvas id="canvas"></canvas>

<script src="jsQR.min.js"></script>
<script>
(() => {
  'use strict';

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const statusEl = document.getElementById('status');
  const countEl = document.getElementById('count');
  const lastEl = document.getElementById('last');
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const copyBtn = document.getElementById('copy-btn');

  const STORAGE_KEY = 'mac_scanner_v2';

  let items = load();
  let selected = new Set(); // индексы выделенных
  let lastScan = { value: '', time: 0 };
  let audioCtx = null;
  let rafId = null;
  let scanning = false;

  // ---------- localStorage ----------
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch {}
  }

  // ---------- Нормализация MAC ----------
  function normalizeMAC(raw) {
    if (!raw) return raw;
    const s = String(raw).trim();

    // Уже MAC с разделителями
    if (/^([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})$/.test(s)) {
      const hex = s.replace(/[^0-9A-Fa-f]/g, '').toUpperCase();
      return hex.match(/.{2}/g).join(':');
    }

    // Префикс "MAC:" / "МАС:" / "MAK:"
    const m = s.match(/^\s*(?:MAC|МАС|MAK|M\.?A\.?C)\s*[:\-]?\s*(.+)$/i);
    if (m) {
      const inner = m[1].trim();
      return normalizeMAC(inner);
    }

    return s;
  }

  // ---------- Звук ----------
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = 1100;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    } catch {}
  }

  // ---------- Вибрация ----------
  function vibrate(pattern) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch {}
  }

  // ---------- Статус ----------
  let statusTimer = null;
  function setStatus(text, isError = false, ms = 2000) {
    statusEl.textContent = text;
    statusEl.className = 'show' + (isError ? ' error' : '');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { statusEl.className = ''; }, ms);
  }

  // ---------- Добавление ----------
  function addMAC(raw) {
    const value = normalizeMAC(raw);
    if (!value) return;

    // Дубликат?
    if (items.some(x => x.value === value)) {
      setStatus('Уже в списке: ' + value);
      vibrate(20);
      return;
    }

    items.push({ value, ts: Date.now() });
    save();
    render();
    updateCopyButton();

    // Показать последний
    lastEl.textContent = value;
    lastEl.classList.add('show');
    clearTimeout(lastEl._t);
    lastEl._t = setTimeout(() => lastEl.classList.remove('show'), 2500);

    setStatus('✓ ' + value);
    beep();
    vibrate(70);
  }

  // ---------- Отрисовка ----------
  function render() {
    countEl.textContent = items.length + ' MAC';

    if (items.length === 0) {
      emptyEl.style.display = 'block';
      // Удалить все .item, оставив #empty
      listEl.querySelectorAll('.item').forEach(n => n.remove());
      return;
    }
    emptyEl.style.display = 'none';

    // Простая перерисовка
    listEl.innerHTML = '';
    items.forEach((it, i) => {
      const div = document.createElement('div');
      div.className = 'item' + (selected.has(i) ? ' selected' : '');
      div.dataset.i = i;

      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = (i + 1) + '.';

      const mac = document.createElement('span');
      mac.className = 'mac';
      mac.textContent = it.value;

      div.appendChild(num);
      div.appendChild(mac);

      // Тап = выделение
      let longPressTimer = null;
      let longPressFired = false;

      div.addEventListener('touchstart', () => {
        longPressFired = false;
        longPressTimer = setTimeout(() => {
          longPressFired = true;
          confirmDelete(i);
        }, 600);
      }, { passive: true });

      div.addEventListener('touchend', () => {
        clearTimeout(longPressTimer);
        if (!longPressFired) toggleSelect(i);
      });

      div.addEventListener('touchmove', () => {
        clearTimeout(longPressTimer);
      }, { passive: true });

      // Для мыши (на случай проверки на ПК)
      div.addEventListener('click', (e) => {
        if (e.pointerType === 'mouse' || !('ontouchstart' in window)) {
          toggleSelect(i);
        }
      });

      listEl.appendChild(div);
    });
  }

  function toggleSelect(i) {
    if (selected.has(i)) selected.delete(i);
    else selected.add(i);

    const node = listEl.querySelector(`.item[data-i="${i}"]`);
    if (node) node.classList.toggle('selected', selected.has(i));

    vibrate(15);
    updateCopyButton();
  }

  function confirmDelete(i) {
    const value = items[i]?.value;
    if (!value) return;
    if (confirm('Удалить ' + value + '?')) {
      items.splice(i, 1);
      selected.clear();
      save();
      render();
      updateCopyButton();
      vibrate(40);
    }
  }

  function updateCopyButton() {
    if (items.length === 0) {
      copyBtn.disabled = true;
      copyBtn.textContent = 'Копировать всё';
      return;
    }
    copyBtn.disabled = false;

    if (selected.size > 0) {
      copyBtn.textContent = 'Копировать ' + selected.size;
    } else {
      copyBtn.textContent = 'Копировать всё';
    }
  }

  // ---------- Копирование ----------
  copyBtn.addEventListener('click', async () => {
    let text;
    if (selected.size > 0) {
      // Выделенные, в порядке исходного списка
      const sorted = Array.from(selected).sort((a, b) => a - b);
      text = sorted.map(i => items[i].value).join('\n');
    } else {
      text = items.map(x => x.value).join('\n');
    }

    if (!text) return;

    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch {
      // фолбэк
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      try { ok = document.execCommand('copy'); } catch {}
      document.body.removeChild(ta);
    }

    if (ok) {
      vibrate(50);
      const n = selected.size > 0 ? selected.size : items.length;
      setStatus('✓ Скопировано: ' + n);
    } else {
      setStatus('Не удалось скопировать', true);
    }
  });

  // ---------- Камера ----------
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Камера недоступна. Откройте в Safari.', true, 5000);
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

      video.srcObject = stream;
      await video.play();
      scanning = true;
      setStatus('Наведите на QR-код', false, 2500);
      scanLoop();
    } catch (e) {
      console.error(e);
      let msg = 'Не удалось открыть камеру';
      if (e.name === 'NotAllowedError') msg = 'Доступ к камере запрещён. Разрешите в Safari.';
      else if (e.name === 'NotFoundError') msg = 'Камера не найдена.';
      else if (e.name === 'NotReadableError') msg = 'Камера занята другим приложением.';
      setStatus(msg, true, 6000);
    }
  }

  function scanLoop() {
    if (!scanning) return;

    if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const maxSide = 640;
      const scale = Math.min(1, maxSide / Math.max(vw, vh));
      const w = Math.round(vw * scale);
      const h = Math.round(vh * scale);

      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(video, 0, 0, w, h);

      const img = ctx.getImageData(0, 0, w, h);
      const code = window.jsQR
        ? window.jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' })
        : null;

      if (code && code.data) {
        const now = Date.now();
        if (code.data !== lastScan.value || now - lastScan.time > 2000) {
          lastScan = { value: code.data, time: now };
          addMAC(code.data);
        }
      }
    }

    rafId = requestAnimationFrame(scanLoop);
  }

  // ---------- Init ----------
  function init() {
    if (typeof window.jsQR !== 'function') {
      setStatus('Ошибка: jsQR не загружен', true, 8000);
      return;
    }

    render();
    updateCopyButton();

    // Запускаем камеру сразу
    // Небольшая задержка, чтобы DOM успел отрисоваться и Safari дал запрос
    setTimeout(startCamera, 300);

    // Освобождение камеры
    window.addEventListener('pagehide', () => {
      scanning = false;
      if (rafId) cancelAnimationFrame(rafId);
      const s = video.srcObject;
      if (s) s.getTracks().forEach(t => t.stop());
    });
  }

  init();
})();
</script>
</body>
</html>
