<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAC Scanner</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #0f1115; color: #e7e9ee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    height: 100%;
    overflow: hidden;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }

  header {
    padding: 10px 14px;
    background: #161922;
    border-bottom: 1px solid #232838;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px; margin: 0; font-weight: 600;
    flex: 1;
  }
  #counter { font-size: 13px; color: #8b93a7; }

  #video-wrap {
    position: relative;
    flex: 1;
    background: #000;
    overflow: hidden;
  }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }
  #video.active { display: block; }

  #placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center;
    color: #8b93a7;
  }
  #placeholder.hidden { display: none; }

  #frame {
    position: absolute;
    top: 50%; left: 50%;
    width: min(72vw, 72vh); height: min(72vw, 72vh);
    transform: translate(-50%, -50%);
    border-radius: 16px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    pointer-events: none;
    display: none;
  }
  #frame.active { display: block; }
  #frame::before, #frame::after {
    content: ""; position: absolute;
    width: 36px; height: 36px;
    border: 3px solid #4ade80;
  }
  #frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
  #frame::after  { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 16px; }

  #toast {
    position: absolute; top: 14px; left: 50%;
    transform: translateX(-50%);
    padding: 8px 16px; border-radius: 20px;
    background: rgba(0,0,0,0.75);
    font-size: 13px;
    max-width: 90%;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
    z-index: 5;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: rgba(180,40,40,0.9); }
  #toast.ok { background: rgba(20,140,60,0.9); }

  #controls {
    padding: 10px 12px;
    background: #161922;
    border-top: 1px solid #232838;
    display: flex; gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  button {
    flex: 1;
    min-width: 0;
    padding: 12px 10px;
    border: none;
    border-radius: 10px;
    background: #232838;
    color: #e7e9ee;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    touch-action: manipulation;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button.primary { background: #2563eb; }
  button.danger  { background: #b91c1c; }
  button.success { background: #15803d; }
  button:active { opacity: .8; }
  button:disabled { opacity: .4; }

  #file-input { display: none; }

  #history {
    position: fixed; inset: 0;
    background: #0f1115;
    display: none;
    flex-direction: column;
    z-index: 100;
  }
  #history.show { display: flex; }
  #history header { background: #161922; }
  #history-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    -webkit-overflow-scrolling: touch;
  }
  .mac-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    background: #1a1e29;
    border-radius: 10px;
    margin-bottom: 8px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
  }
  .mac-item .idx {
    color: #6b7280;
    font-size: 12px;
    min-width: 24px;
  }
  .mac-item .mac {
    flex: 1;
    word-break: break-all;
    color: #93c5fd;
  }
  .mac-item .del {
    background: transparent;
    border: none;
    color: #ef4444;
    font-size: 20px;
    padding: 0 8px;
    flex: none;
    cursor: pointer;
  }
  #history-empty {
    text-align: center;
    color: #6b7280;
    padding: 48px 24px;
    font-size: 14px;
  }

  #canvas { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>MAC Scanner</h1>
    <span id="counter">0 шт.</span>
  </header>

  <div id="video-wrap">
    <video id="video" playsinline muted autoplay></video>
    <div id="frame"></div>

    <div id="placeholder">
      <div style="font-size:48px">📷</div>
      <div>Нажмите «Камера» для сканирования<br>или «Снимок» — откроется камера телефона</div>
    </div>

    <div id="toast"></div>
  </div>

  <div id="controls">
    <button id="btn-camera" class="primary">📷 Камера</button>
    <button id="btn-photo">🖼 Снимок</button>
    <button id="btn-history" class="success">📋 История</button>
  </div>
</div>

<input id="file-input" type="file" accept="image/*" capture="environment">

<div id="history">
  <header>
    <button id="btn-back" style="flex:0;padding:8px 14px;background:#232838">← Назад</button>
    <h1 style="margin-left:10px">История</h1>
    <span id="counter2" style="color:#8b93a7;font-size:13px"></span>
  </header>
  <div id="history-list"></div>
  <div id="history-empty">Пока пусто. Отсканируйте первый QR.</div>
  <div id="controls">
    <button id="btn-copy-all" class="primary">📄 Копировать все</button>
    <button id="btn-clear" class="danger">🗑 Очистить</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<!-- jsQR: подключается из соседнего файла jsQR.min.js -->
<script src="jsQR.min.js"></script>

<script>
(() => {
  'use strict';

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const frame = document.getElementById('frame');
  const placeholder = document.getElementById('placeholder');
  const toast = document.getElementById('toast');
  const counter = document.getElementById('counter');
  const counter2 = document.getElementById('counter2');
  const btnCamera = document.getElementById('btn-camera');
  const btnPhoto = document.getElementById('btn-photo');
  const btnHistory = document.getElementById('btn-history');
  const btnBack = document.getElementById('btn-back');
  const btnCopyAll = document.getElementById('btn-copy-all');
  const btnClear = document.getElementById('btn-clear');
  const fileInput = document.getElementById('file-input');
  const historyScreen = document.getElementById('history');
  const historyList = document.getElementById('history-list');
  const historyEmpty = document.getElementById('history-empty');

  let stream = null;
  let scanning = false;
  let rafId = null;
  const STORAGE_KEY = 'mac_scanner_history_v1';
  let history = loadHistory();
  let lastScan = { value: '', time: 0 };
  let audioCtx = null;
  let detector = null; // BarcodeDetector, если поддерживается

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function saveHistory() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch {}
  }

  function beep(ok = true) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = ok ? 1000 : 300;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } catch {}
  }

  function vibrate(ms = 60) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch {}
  }

  let toastTimer = null;
  function showToast(text, kind = '') {
    toast.textContent = text;
    toast.className = 'show ' + kind;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = ''; }, 1800);
  }

  function normalizeMAC(raw) {
    if (!raw) return raw;
    const s = raw.trim();
    const macLike = s.match(/^([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})$/);
    if (macLike) {
      const hex = s.replace(/[^0-9A-Fa-f]/g, '').toUpperCase();
      return hex.match(/.{2}/g).join(':');
    }
    const m = s.match(/^\s*(?:MAC|МАС|MAK|M\.?A\.?C)\s*[:\-]?\s*([0-9A-Fa-f]{12})\s*$/i);
    if (m) {
      const hex = m[1].toUpperCase();
      return hex.match(/.{2}/g).join(':');
    }
    return s;
  }

  function extractValue(raw) {
    if (!raw) return raw;
    const s = raw.trim();
    const m = s.match(/^\s*(?:MAC|МАС|MAK)\s*[:\-]?\s*(.+)$/i);
    if (m) return normalizeMAC(m[1]);
    return normalizeMAC(s);
  }

  function addToHistory(rawValue) {
    const value = extractValue(rawValue);
    if (!value) return;

    const recent = history.slice(-100);
    if (recent.some(x => x.value === value)) {
      showToast('Уже есть: ' + value, '');
      vibrate(30);
      return;
    }

    history.push({ value, raw: rawValue, ts: Date.now() });
    saveHistory();
    updateCounters();
    renderHistory();
    showToast('✓ ' + value, 'ok');
    beep(true);
    vibrate(80);
  }

  function updateCounters() {
    const n = history.length;
    counter.textContent = n + ' шт.';
    counter2.textContent = n + ' шт.';
  }

  function renderHistory() {
    historyList.innerHTML = '';
    if (history.length === 0) {
      historyEmpty.style.display = 'block';
      return;
    }
    historyEmpty.style.display = 'none';

    history.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'mac-item';
      div.innerHTML = `
        <span class="idx">${i + 1}</span>
        <span class="mac">${escapeHtml(item.value)}</span>
        <button class="del" data-i="${i}" aria-label="Удалить">✕</button>
      `;
      historyList.appendChild(div);
    });

    historyList.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(e.currentTarget.dataset.i, 10);
        history.splice(idx, 1);
        saveHistory();
        updateCounters();
        renderHistory();
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast('Камера недоступна. Используйте «Снимок».', 'error');
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });
    } catch (e) {
      console.error(e);
      let msg = 'Не удалось открыть камеру';
      if (e.name === 'NotAllowedError') msg = 'Доступ к камере запрещён.';
      else if (e.name === 'NotFoundError') msg = 'Камера не найдена.';
      else if (e.name === 'NotReadableError') msg = 'Камера занята другим приложением.';
      else if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.protocol !== 'file:') {
        msg = 'Нужен HTTPS или откройте в браузере.';
      }
      showToast(msg, 'error');
      return;
    }

    video.srcObject = stream;
    try { await video.play(); } catch {}
    video.classList.add('active');
    frame.classList.add('active');
    placeholder.classList.add('hidden');
    btnCamera.textContent = '■ Стоп';
    btnCamera.classList.add('danger');
    btnCamera.classList.remove('primary');
    scanning = true;

    // Пробуем нативный BarcodeDetector (Chrome Android)
    if ('BarcodeDetector' in window) {
      try {
        detector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch { detector = null; }
    }

    scanLoop();
  }

  function stopCamera() {
    scanning = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;
    video.classList.remove('active');
    frame.classList.remove('active');
    placeholder.classList.remove('hidden');
    btnCamera.textContent = '📷 Камера';
    btnCamera.classList.remove('danger');
    btnCamera.classList.add('primary');
  }

  async function scanLoop() {
    if (!scanning) return;

    if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth) {
      // 1. Пробуем нативный детектор
      if (detector) {
        try {
          const codes = await detector.detect(video);
          if (codes && codes.length && codes[0].rawValue) {
            handleScan(codes[0].rawValue);
          }
        } catch { /* fallback */ }
      } else {
        // 2. jsQR
        const vw = video.videoWidth, vh = video.videoHeight;
        const maxSide = 640;
        const scale = Math.min(1, maxSide / Math.max(vw, vh));
        const w = Math.round(vw * scale), h = Math.round(vh * scale);

        canvas.width = w; canvas.height = h;
        ctx.drawImage(video, 0, 0, w, h);

        const img = ctx.getImageData(0, 0, w, h);
        const code = window.jsQR
          ? window.jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' })
          : null;

        if (code && code.data) {
          handleScan(code.data);
        }
      }
    }
    rafId = requestAnimationFrame(scanLoop);
  }

  function scanImage(imgEl) {
    const maxSide = 1280;
    const vw = imgEl.naturalWidth || imgEl.width;
    const vh = imgEl.naturalHeight || imgEl.height;
    const scale = Math.min(1, maxSide / Math.max(vw, vh));
    const w = Math.round(vw * scale), h = Math.round(vh * scale);

    canvas.width = w; canvas.height = h;
    ctx.drawImage(imgEl, 0, 0, w, h);

    const img = ctx.getImageData(0, 0, w, h);

    let code = null;
    for (const mode of ['dontInvert', 'attemptBoth', 'invertFirst']) {
      code = window.jsQR(img.data, w, h, { inversionAttempts: mode });
      if (code && code.data) break;
    }
    return code;
  }

  function handleScan(data) {
    const now = Date.now();
    if (data === lastScan.value && now - lastScan.time < 2000) return;
    lastScan = { value: data, time: now };
    addToHistory(data);
  }

  btnPhoto.addEventListener('click', () => {
    fileInput.value = '';
    fileInput.click();
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      try {
        // Пробуем нативный детектор на картинке
        let found = null;
        if ('BarcodeDetector' in window) {
          try {
            const det = new BarcodeDetector({ formats: ['qr_code'] });
            const codes = await det.detect(img);
            if (codes && codes.length) found = codes[0].rawValue;
          } catch {}
        }
        // Иначе — jsQR
        if (!found) {
          const code = scanImage(img);
          if (code && code.data) found = code.data;
        }

        if (found) addToHistory(found);
        else {
          showToast('QR не найден. Попробуйте ближе/резче.', 'error');
          beep(false);
        }
      } catch (err) {
        console.error(err);
        showToast('Ошибка обработки фото', 'error');
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    img.onerror = () => {
      showToast('Не удалось открыть изображение', 'error');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  btnCamera.addEventListener('click', () => {
    if (scanning) stopCamera();
    else startCamera();
  });

  btnHistory.addEventListener('click', () => {
    if (scanning) stopCamera();
    historyScreen.classList.add('show');
    renderHistory();
  });

  btnBack.addEventListener('click', () => {
    historyScreen.classList.remove('show');
  });

  btnCopyAll.addEventListener('click', async () => {
    if (history.length === 0) {
      showToast('История пуста', '');
      return;
    }
    const text = history.map(x => x.value).join('\n');

    try {
      await navigator.clipboard.writeText(text);
      showToast('✓ Скопировано: ' + history.length + ' шт.', 'ok');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch {}
      document.body.removeChild(ta);
      if (ok) showToast('✓ Скопировано: ' + history.length + ' шт.', 'ok');
      else showToast('Копирование не удалось. Выделите вручную.', 'error');
    }
  });

  btnClear.addEventListener('click', () => {
    if (history.length === 0) return;
    if (confirm('Удалить все ' + history.length + ' записей?')) {
      history = [];
      saveHistory();
      updateCounters();
      renderHistory();
      showToast('Очищено', '');
    }
  });

  function init() {
    if (typeof window.jsQR !== 'function' && !('BarcodeDetector' in window)) {
      showToast('Нет ни jsQR, ни BarcodeDetector. Положите jsQR.min.js рядом с HTML.', 'error');
    }
    updateCounters();
    renderHistory();

    const ua = navigator.userAgent || '';
    const inTelegram = /Telegram/i.test(ua);
    if (inTelegram) {
      showToast('В Telegram используйте «Снимок»', '');
      setTimeout(() => showToast('Или откройте файл в Chrome/Safari', ''), 3000);
    }

    window.addEventListener('pagehide', stopCamera);
    window.addEventListener('beforeunload', stopCamera);
  }

  init();
})();
</script>
</body>
</html>
